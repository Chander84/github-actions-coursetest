name: With Actions #Workflow name
on:
    workflow_dispatch:
jobs:
    with-actions-job: #Job ID
        name: With Actions Job #Job name
        runs-on: ubuntu-latest
        steps:
            - name: first step from with actions job
              uses: actions/checkout@v3
            - name: Set up Java 21
              uses: actions/setup-java@v3
              with:
                distribution: 'temurin'
                java-version: '21'